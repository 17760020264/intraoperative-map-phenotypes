name: Validate public release

on:
  push:
  pull_request:

jobs:
  python-classifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/verify_reference_outputs.py
      - run: python scripts/audit_public_release.py
      - run: python -m pytest tests -q
      - run: python -m compileall -q app analysis pipeline scripts run_all.py run_phenotype_pipeline.py

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
      - name: Parse R scripts
        shell: Rscript {0}
        run: |
          files <- list.files("analysis", pattern="\\.R$", full.names=TRUE)
          invisible(lapply(files, parse))
          cat("Parsed", length(files), "R scripts successfully.\n")
